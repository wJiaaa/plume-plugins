name: 发布插件市场

# 把 plugins/ 下的插件构建、按平台打包，发到这个仓库的 GitHub Pages（格式见 docs/distribution.md），Plume 从
# https://wjiaaa.github.io/plume-plugins/marketplace.json 读市场、下载插件。
# 推到 main 时发布；PR 上只校验、打包，查出「内容变了版本号没升」就失败，不发布。
# Pages 要在仓库设置里打开，来源选 GitHub Actions。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只发一次；正在发的不取消，发到一半的站点不完整。
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # package.json 没写 packageManager，版本在这里给
      - name: 安装 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      # 插件 SDK 从 npm 装（版本见 pnpm-workspace.yaml 的 catalog）。pnpm-workspace.yaml 的 supportedArchitectures 让 macOS、Windows 两种架构的原生模块也装上
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验市场
        run: pnpm validate

      - name: 构建插件
        run: pnpm build:plugins

      # 和线上那份比：版本号没变、内容变了就失败（发出去的版本不可变）
      - name: 按平台打包
        run: pnpm build:dist --published https://wjiaaa.github.io/plume-plugins/marketplace.json

      - name: 上传站点
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
