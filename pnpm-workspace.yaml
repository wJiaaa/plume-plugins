packages:
  - plugins/*

# 插件 SDK 从 npm 装，各插件和根目录都写 `catalog:`，版本只在这里改一处。SDK 的版本跟着 Plume 走：
# 插件用了新版 SDK 才有的接口，就要求用户的 Plume 至少是这一版。
catalog:
  "@plumeai/plugin-sdk": ^0.3.0

# pnpm 默认不跑依赖的安装脚本；esbuild 要靠它装平台包。
onlyBuiltDependencies:
  - esbuild

# koffi 的安装脚本是在没有预编译包时现编，它自带各平台的预编译包，用不上。
# ssh2（SSH 插件）的安装脚本现编可选的加密加速和 cpu-features，不编时用自带的纯 JS 实现，打包机不需要 C++ 工具链。
ignoredBuiltDependencies:
  - koffi
  - ssh2
  - cpu-features

# 可选依赖装哪些平台的，而不只是本机的：插件构建时带上各平台、各架构的原生模块，build-dist 按目标裁掉别的。
# 原生模块一个平台一个包，pnpm 默认只装本机那份，别的平台的市场包就会带着跑不起来的二进制。改了这里要删掉 node_modules 重装才生效。
supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - x64
    - arm64
