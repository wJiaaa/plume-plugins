# Git 钩子，和本体仓库的 lefthook.yml 同一套分工：pre-commit 只碰暂存的文件和一秒内跑完的检查，pre-push 跑全量。
# 插件规则来自 npm 上的插件 SDK（scripts/check-plugins.mjs），提交信息的格式见 scripts/check-commit-msg.mjs。
#
# `pnpm install` 时由根目录的 `prepare` 装上（`lefthook install`）。要临时跳过：LEFTHOOK=0 git commit …

pre-commit:
  parallel: true
  jobs:
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: format
            glob: "*.{ts,tsx,mts,cts,mjs,cjs,js,jsx,json,jsonc,css,yml,yaml}"
            run: ./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files} && node scripts/check-only-commit.mjs {staged_files}
            stage_fixed: true

          - name: lint
            glob: "*.{ts,tsx,mts,cts,mjs,js,jsx}"
            run: ./node_modules/.bin/oxlint --deny-warnings --fix {staged_files} && node scripts/check-only-commit.mjs {staged_files}
            stage_fixed: true

    - name: whitespace
      run: git diff --cached --check

    - name: plugin-rules
      # 只引用公开接口、样式只用 token、界面文字走 messages.ts：全量跑一遍几秒。
      glob: "*.{ts,tsx,css}"
      run: pnpm check:plugins

commit-msg:
  jobs:
    - name: commit-msg
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  jobs:
    - name: check
      run: pnpm check

    - name: knip
      run: pnpm knip
